# прод: монтируется вместо conf.d (см. docker-compose.prod.yml)

# HTTP: только проверка домена для Let's Encrypt, остальное — на HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://industry-tasks.tsu.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name industry-tasks.tsu.ru;

    # выпускает и продлевает certbot на хосте, см. docs/deploy.md
    ssl_certificate     /etc/letsencrypt/live/industry-tasks.tsu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/industry-tasks.tsu.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/app.conf;
}
