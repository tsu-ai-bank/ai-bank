name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # кнопка ручного запуска во вкладке Actions

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tsu-ai-bank/ai-bank-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # право публиковать образ в GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Вход в GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация образа
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # job deploy (заход на сервер и перезапуск) добавим, когда будет доступ к серверу